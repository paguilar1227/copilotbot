name: CopilotBot Windows installer
on:
  workflow_dispatch:
    inputs:
      windows_validation:
        description: Run Windows-specific installation and runtime checks
        type: boolean
        default: true
      publish:
        description: Publish the built installer when running from main
        type: boolean
        default: false
      installer_run_id:
        description: Reuse an installer from a prior run when only verification files changed
        type: string
        default: ''
  push:
    paths:
      - 'copilotbot/**'
      - 'server/**'
      - 'src/**'
      - 'shared/**'
      - 'electron/**'
      - 'scripts/prepare-cua-win.mjs'
      - 'scripts/smoke-packaged-server.mjs'
      - 'scripts/testing/verify-open-brain-updates.ts'
      - 'third_party/github-copilot-cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/copilotbot-windows.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
      - run: pnpm exec vitest run electron/updater.test.mjs src/components/SettingsModal.updates.test.ts server/copilotbot/open-brain-runtime.test.ts server/copilotbot/open-brain-updates.test.ts server/plugins/host.test.ts src/copilotbot/OpenBrainSetup.test.ts src/copilotbot/OpenBrainDialog.test.ts src/copilotbot/plugins/PluginPage.test.ts src/copilotbot/plugins/ExtensionsPanel.test.ts
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
      - name: Regression - WSL setup under Windows PowerShell 5.1
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        shell: powershell
        run: ./copilotbot/windows/setup-dependency.test.ps1
      - name: Regression - extract and run the official Windows CUA archive
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        run: pnpm build:cua:win
      - name: Package CopilotBot with independent plugin setup
        if: inputs.installer_run_id == ''
        run: node copilotbot/package.mjs --win
      - name: Reuse unchanged installer for native verification
        if: inputs.installer_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
        run: |
          $source = gh run view $env:INSTALLER_RUN_ID -R $env:GITHUB_REPOSITORY --json headSha --jq .headSha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve installer source' }
          git fetch origin $source --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installer source' }
          node copilotbot/windows/verify-reuse.mjs $source
          if ($LASTEXITCODE -ne 0) { throw 'Installer source or build contract changed' }
          gh run download $env:INSTALLER_RUN_ID -R $env:GITHUB_REPOSITORY -n copilotbot-windows-installer -D release-copilotbot
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download installer artifact' }
          $installer = (Get-ChildItem release-copilotbot/*-windows-x64-setup.exe).FullName
          $destination = Join-Path $env:GITHUB_WORKSPACE 'release-copilotbot/win-unpacked'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer extraction failed: $($process.ExitCode)" }
      - name: Verify the bundled browser
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release-copilotbot/win-unpacked/resources"
      - name: Verify the packaged server
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release-copilotbot/win-unpacked/resources/browser-engine"
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release-copilotbot/win-unpacked/resources/server
      - name: Install in a clean app directory and verify its shipped resources
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release-copilotbot/*-windows-x64-setup.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'CopilotBot Clean Install'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS failed: $($process.ExitCode)" }
          @('CopilotBot.exe', 'resources/server/index.js', 'resources/ui/index.html', 'resources/copilot-cli/copilot.exe', 'resources/powershell/pwsh.exe', 'resources/licenses/github-copilot-cli-LICENSE.md', 'resources/copilotbot-setup/setup-dependency.ps1') | ForEach-Object {
            if (-not (Test-Path (Join-Path $destination $_))) { throw "Missing installed file: $_" }
          }
          if (Test-Path "$destination/resources/open-brain-runtime") { throw 'Desktop installer must not bundle the plugin runtime' }
          if (Test-Path "$destination/resources/plugins/open-brain-lite") { throw 'Desktop installer must not bundle the Open Brain extension' }
          & "$destination/resources/powershell/pwsh.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Installed PowerShell cannot start' }
          & "$destination/resources/copilot-cli/copilot.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Copilot cannot start' }
      - name: Verify Check for updates and an in-place upgrade from .16
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'CopilotBot-baseline.exe'
          Invoke-WebRequest 'https://github.com/paguilar1227/copilotbot/releases/download/v0.1.112-copilotbot.16/CopilotBot-0.1.112-copilotbot.16-windows-x64-setup.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLower() -ne '27ccdbc7fd9720c43e0c12e601b0d20118d34a13d92a8d941166972ec8ffac44') { throw 'Baseline installer checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'CopilotBot Clean Install'
          $process = Start-Process $baseline -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Baseline install failed: $($process.ExitCode)" }
          node copilotbot/windows/verify-update.mjs --resources="$env:GITHUB_WORKSPACE/release-copilotbot/win-unpacked/resources" --installed="$destination" --output="$env:GITHUB_WORKSPACE/scratch/copilotbot-update-proof"
          if ($LASTEXITCODE -ne 0) { throw 'In-app update verification failed' }
      - name: Launch the updated app with the preserved test workspace
        if: github.event_name != 'workflow_dispatch' || inputs.windows_validation
        shell: pwsh
        run: |
          $proof = "$env:GITHUB_WORKSPACE/scratch/copilotbot-update-proof"
          $destination = Join-Path $env:RUNNER_TEMP 'CopilotBot Clean Install'
          $env:OMB_SMOKE_TEST = '1'
          $env:OMB_DATA_DIR = "$proof/workspace"
          $process = Start-Process "$destination/CopilotBot.exe" -ArgumentList "--user-data-dir=`"$proof/user-data`"" -PassThru -Wait -RedirectStandardOutput "$proof/relaunch.log" -RedirectStandardError "$proof/relaunch-error.log"
          if ($process.ExitCode -ne 0) { throw "Updated app exited $($process.ExitCode)" }
          if (-not (Select-String -Path "$proof/relaunch.log" -Pattern '\[smoke\] renderer-ready' -Quiet)) { throw 'Updated app did not become ready' }
          if ((Get-Content "$proof/workspace/saved-artifact.txt" -Raw).Trim() -ne 'Existing bot artifact') { throw 'Workspace artifact changed on relaunch' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.windows_validation)
        with:
          name: copilotbot-windows-update-proof
          path: |
            scratch/copilotbot-update-proof/*.json
            scratch/copilotbot-update-proof/*.png
            scratch/copilotbot-update-proof/*.log
            scratch/copilotbot-update-proof/logs/
      - name: Checksum the installer
        shell: pwsh
        run: |
          Get-ChildItem release-copilotbot/*-windows-x64-setup.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release-copilotbot/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: copilotbot-windows-installer
          path: |
            release-copilotbot/*-windows-x64-setup.exe
            release-copilotbot/*-windows-x64-setup.exe.blockmap
            release-copilotbot/latest.yml
            release-copilotbot/SHA256SUMS.txt
          if-no-files-found: error

  update-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paguilar1227/open-brain-lite
          ref: main
          path: open-brain-source
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify real update, rollback and failed migration recovery
        run: node --experimental-strip-types scripts/testing/verify-open-brain-updates.ts
        env:
          OPEN_BRAIN_SOURCE: ${{ github.workspace }}/open-brain-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: open-brain-update-acceptance
          path: scratch/open-brain-update-proof

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [build, update-acceptance]
    concurrency:
      group: copilotbot-installer-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: copilotbot-windows-installer
          path: installer
      - name: Publish the tested installer once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./copilotbot/version.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft"; then
            if test "$(cat "$RUNNER_TEMP/draft")" = false; then
              echo "This version is already published; preserving its original installer."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "CopilotBot $version" --notes "Enables Settings → Check for updates on Windows, downloading verified CopilotBot releases and applying them with Restart and install. Existing app data and independently installed Open Brain plugins are preserved. Versions .16 and earlier need this installer once to enable future in-app updates. Windows acceptance covers the real update controls, download, in-place upgrade from .16, preserved files, and launch of the updated app. The installer is unsigned."
          fi
          gh release upload "$tag" installer/* --clobber
          gh release edit "$tag" --draft=false --latest
